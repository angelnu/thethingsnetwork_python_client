[project]
name = "ttn_client"
dynamic = ["version"]
authors = [
  { name="Angel Nunez Mencias", email="pypi@angelnu.com" },
]
description = "A python client to fetch/receive and parse uplink messages from The Thinks Network"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/angelnu/thethinksnetwork_python_client"
Issues = "https://github.com/angelnu/thethinksnetwork_python_client/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Fallback used when no git tag is reachable (e.g. shallow clones); the
# release workflow fetches the full history so tagged builds always win.
fallback-version = "0.0.0"

# Keep the emitted core metadata at 2.4: hatchling >= 1.30 defaults to
# Metadata-Version 2.5, which is rejected by the twine bundled in
# pypa/gh-action-pypi-publish < 1.14 (twine < 7). Pinning the emitted
# metadata version is deterministic, unlike pinning hatchling itself
# (its defaults are not monotonic: 1.30 -> 2.5, 1.31 -> 2.4, 1.32 -> 2.5).
[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
